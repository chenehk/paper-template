project:
  type: book
  output-dir: _site

book:
  title: "Paper title"
  author: "Author"
  chapters:
    - index.qmd
    # Part titles are linked to the Paper page's sections by web/part-links.html;
    # keep the two in sync when renaming a part. Add each new page under its part.
    - part: "Introduction"
      chapters:
        - intro.qmd
    - part: "Related work"
      chapters:
        - related/topic.qmd
    - part: "Method"
      chapters:
        - method/component.qmd
    - part: "Experiments"
      chapters:
        - experiments/index.qmd
    - references.qmd
    - ideas.qmd
    - part: "Explorations"
      chapters:
        - explorations/index.qmd
        # <explorations> (maintained by tools/sync_chapters.py; do not edit by hand)
        # </explorations>
    - part: "Obsolete explorations"
      chapters:
        # <obsolete> (maintained by tools/sync_chapters.py; do not edit by hand)
        - explorations/obsolete-none.qmd
        # </obsolete>
    - workflow.qmd
  page-navigation: true

bibliography: refs.bib
link-citations: true
link-bibliography: true
number-sections: true
crossref:
  chapters: true

format:
  html:
    theme: cosmo
    css: web/sidebar.css
    fig-cap-location: top
    toc: true
    toc-depth: 3
    code-copy: true
    include-after-body:
      - web/exploration-sections.html  # generated by tools/sync_chapters.py
      - web/part-links.html
  latex:
    documentclass: article
    keep-tex: true
